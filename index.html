<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
  content="width=device-width,initial-scale=1.0">
  <title> Generador de tarjetas </title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600&family=Quicksand:wght@400;500&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Lora:wght@500;600&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@500;600&display=swap" rel="stylesheet">
  <link href="style.css" rel="stylesheet">
</head>
<body>

  <div class="campo-presentation">
      <h1> Generador de tarjetas </h1>
      <p>Crea pequeñas tarjetas personalizadas</p>
  </div>

  <form>

       <div class="campo-nombre">
          <label for="nombre">Nombre:</label>
          <input id="nombre" type="text" 
           placeholder="Escribe un nombre...">
       </div>

       <div class="campo-frase">
          <label for="frase">Frase:</label>
          <textarea id="frase"
          placeholder="Escribe una frase..."></textarea>
       </div>

     <button type="button"
     id="boton"> Crear tarjeta </button>

     <button type="button"
     id="boton-estilo"> Elegir estilo </button>

     <div id="selector-estilos">
      
      <button type="button" class="opcion-estilo" data-estilo="dreamy">
        <span>✨ Dreamy</span>
        <div class="preview-estilo preview-dreamy"></div>
      </button>

      <button type="button" class="opcion-estilo" data-estilo="night">
        <span>🌙 Night</span>
        <div class="preview-estilo preview-night"></div>
      </button>

      <button type="button" class="opcion-estilo" data-estilo="floral">
        <span>🌷 Floral</span>
        <div class="preview-estilo preview-floral"></div>
      </button>

      <button type="button" class="opcion-estilo" data-estilo="love-letter">
        <span>💌 Love letter</span>
        <div class="preview-estilo preview-love"></div>
      </button>

     </div>

  </form>

  <div class="section-tarjetas">

      <h2>Mis tarjetas</h2>

   
      <div id="tarjetas">

      </div>

  </div>

  <div class="decoraciones">

      <img src="images/envelope.png"
      class="sticker-envelope">

      <img src="images/stars.png"
      class="sticker-stars">

      <img src="images/moon.png"
      class="sticker-moon">
     
      <img src="images/flowers.png"
      class="sticker-flowers">

      <img src="images/cat.png"
      class="sticker-cat">
     
      <img src="images/washi-tape.png"
      class="sticker-washi"> 

      <img src="images/heart.png"
      class="sticker-heart">

  </div>

  <div id="mensaje-alerta">
    <div class="alerta-contenido">
        <h3>Oops...</h3>
        <p>Completa todos los campos antes de crear tu tarjeta.</p>
        <button id="cerrar-alerta" type="button">Entendido ❤︎</button>
    </div>
  </div>

 <script src="script.js"></script>

</body>
</html>
